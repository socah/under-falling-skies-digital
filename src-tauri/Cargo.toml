[package]
name = "under-falling-skies"
version = "0.1.0"
description = "Unofficial digital adaptation of the Under Falling Skies solo game"
authors = ["socah"]
license = ""
repository = "https://github.com/socah/under-falling-skies-digital"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "under_falling_skies_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-log = "2"
