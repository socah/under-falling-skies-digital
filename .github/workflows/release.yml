name: Release

# Push a tag like v0.1.0 to build the Linux app and Android APK and publish a GitHub release.
# Run it manually from the Actions tab to build without publishing (files appear as run artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (AppImage + .deb)
    # Built on the oldest supported Ubuntu so the AppImage runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node, Bun and Rust (from mise.toml)
        uses: jdx/mise-action@v3

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile
      - run: bun tauri build

      - name: Collect files
        run: |
          mkdir dist-release
          v=$(node -p "require('./package.json').version")
          cp src-tauri/target/release/bundle/appimage/*.AppImage "dist-release/under-falling-skies_${v}_amd64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "dist-release/under-falling-skies_${v}_amd64.deb"
          ls -lh dist-release

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist-release/*

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also requests the legacy "tools" package, which Google removed.
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Node, Bun and Rust (from mise.toml)
        uses: jdx/mise-action@v3

      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # The Android project (src-tauri/gen/android) is generated fresh on every build, not committed.
      - name: Generate Android project
        run: |
          bun tauri android init --ci --skip-targets-install
          bun tauri icon app-icon.png
          # Use our MainActivity (handles the status bar / notch insets), keeping the generated package name.
          f=$(find src-tauri/gen/android/app/src/main -name MainActivity.kt)
          echo "--- generated $f:"; cat "$f"
          pkg=$(sed -n 's/^package //p' "$f")
          sed "s/^package .*/package $pkg/" src-tauri/android/MainActivity.kt > "$f"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat src-tauri/android-signing.gradle.kts.snippet >> src-tauri/gen/android/app/build.gradle.kts

      - name: Build APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bun tauri android build --apk

      - name: Collect files
        run: |
          mkdir dist-release
          v=$(node -p "require('./package.json').version")
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             "dist-release/under-falling-skies_${v}.apk"
          ls -lh dist-release

      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: dist-release/*

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist-release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Under Falling Skies $GITHUB_REF_NAME" \
            --generate-notes
